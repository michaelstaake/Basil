# Builds Windows portable + setup EXEs, and the Linux .deb, when a GitHub
# Release is published (not on push, PR, or draft release creation).
# Local `npm run build` is unchanged. Pull-request deb builds live in linux-deb.yml.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from release tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Release tag '$tag' must be a semver version (e.g. 26.7.1 or v26.7.1)."
          }
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Building as version $version"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build portable and setup EXEs
        # --publish never: on tagged commits electron-builder otherwise tries to
        # publish and fails without GH_TOKEN. Assets are uploaded via gh below.
        run: npm run build -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $portable = Get-ChildItem -Path release -Filter 'Basil-*-portable.exe' | Select-Object -First 1
          $setup = Get-ChildItem -Path release -Filter 'Basil-*-setup.exe' | Select-Object -First 1
          if (-not $portable -or -not $setup) {
            Get-ChildItem -Path release -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected Basil-*-portable.exe and Basil-*-setup.exe in release/'
          }
          gh release upload $tag $portable.FullName $setup.FullName --clobber
          Write-Host "Uploaded $($portable.Name) and $($setup.Name) to $tag"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Release tag '$tag' must be a semver version (e.g. 26.7.1 or v26.7.1)." >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "Building as version $version"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build deb
        # --publish never: on tagged commits electron-builder otherwise tries to
        # publish and fails without GH_TOKEN. The asset is uploaded via gh below.
        run: npm run build:deb -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          deb="$(find release -maxdepth 1 -type f -name 'Basil-*-amd64.deb' | head -n 1)"
          if [[ -z "$deb" ]]; then
            ls -la release || true
            echo "Expected Basil-*-amd64.deb in release/" >&2
            exit 1
          fi
          gh release upload "$tag" "$deb" --clobber
          echo "Uploaded $(basename "$deb") to $tag"
