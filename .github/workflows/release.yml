# Builds Windows portable + setup EXEs when a GitHub Release is published
# (not on push, PR, or draft release creation). Local `npm run build` is unchanged.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version from release tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "Release tag '$tag' must be a semver version (e.g. 26.7.1 or v26.7.1)."
          }
          npm version $version --no-git-tag-version --allow-same-version
          Write-Host "Building as version $version"

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build portable and setup EXEs
        run: npx vite build && node scripts/with-build-version.mjs --win --publish never
        env:
          # Avoid electron-builder trying to publish; we upload assets below.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $portable = Get-ChildItem -Path release -Filter 'Basil-*-portable.exe' | Select-Object -First 1
          $setup = Get-ChildItem -Path release -Filter 'Basil-*-setup.exe' | Select-Object -First 1
          if (-not $portable -or -not $setup) {
            Get-ChildItem -Path release -ErrorAction SilentlyContinue | Format-Table Name, Length
            throw 'Expected Basil-*-portable.exe and Basil-*-setup.exe in release/'
          }
          gh release upload $tag $portable.FullName $setup.FullName --clobber
          Write-Host "Uploaded $($portable.Name) and $($setup.Name) to $tag"
