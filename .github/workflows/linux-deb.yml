# Builds the Linux .deb on pull requests and manual runs. Does not publish a
# GitHub Release. The published-release upload lives in release.yml.
name: Linux deb

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Build deb
        run: npm run build:deb -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: basil-deb
          path: release/Basil-*-amd64.deb
          if-no-files-found: error
